name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.94", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --test conformance reference_transport_local_http -- --ignored
      - run: cargo check --locked --lib --no-default-features
      - run: cargo run --locked --example quickstart
      - run: cargo run --locked --example telemetry_json
      - run: cargo run --locked --example time_series
      - run: cargo run --locked --example functions
      - run: cargo run --locked --example grouped_scan
      - run: cargo run --locked --example schema_plugins
      - run: cargo run --locked --example telemetry_functions
      - run: cargo run --locked --example distinct_sketches

  package:
    name: Verify publishable crate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: package
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: metadata
        run: python3 .github/scripts/release.py
      - run: cargo package --locked --registry crates-io --package datafusion-kql-native
      - run: cargo publish --dry-run --locked --registry crates-io --package datafusion-kql-native
      - name: Checksum the verified package
        working-directory: target/package
        env:
          CRATE_FILE: ${{ steps.metadata.outputs.file }}
        run: sha256sum "$CRATE_FILE" > "$CRATE_FILE.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crate-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.sha }}
          path: |
            ${{ steps.metadata.outputs.archive }}
            ${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
