[package]
name = "datafusion-kql"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "A native Kusto Query Language frontend for Apache DataFusion"
repository = "https://github.com/vertex-shift/datafusion-kql"
license = "Apache-2.0"
keywords = ["datafusion", "kql", "kusto", "arrow", "query"]
categories = ["database", "parser-implementations"]

[features]
default = ["parquet"]
parquet = ["datafusion/parquet"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
datafusion = { version = "55.2.0", default-features = false, features = [
    "datetime_expressions",
    "math_expressions",
    "nested_expressions",
    "recursive_protection",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
futures = "0.3"
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
datafusion = { version = "55.2.0", default-features = false, features = ["sql"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "kql"
harness = false

[profile.dev]
debug = 0

[profile.test]
debug = 0
