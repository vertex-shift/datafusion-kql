[package]
name = "datafusion-kql-native"
version = "0.13.0"
edition = "2024"
rust-version = "1.94"
description = "A native Kusto Query Language frontend for Apache DataFusion"
repository = "https://github.com/vertex-shift/datafusion-kql"
documentation = "https://docs.rs/datafusion-kql-native"
readme = "README.md"
license = "Apache-2.0"
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]
keywords = ["datafusion", "kql", "kusto", "arrow", "query"]
categories = ["database", "parser-implementations"]

[lib]
name = "datafusion_kql"

[features]
default = ["parquet"]
parquet = ["datafusion/parquet"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dec = { version = "0.4.11", default-features = false }
datafusion = { version = "55.2.0", default-features = false, features = [
    "datetime_expressions",
    "math_expressions",
    "nested_expressions",
    "recursive_protection",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
datafusion-functions-aggregate-common = "55.2.0"
futures = "0.3"
regex = "1"
rustfft = "6.4"
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
datafusion = { version = "55.2.0", default-features = false, features = ["sql"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "kql"
harness = false

[profile.dev]
debug = 0

[profile.test]
debug = 0
